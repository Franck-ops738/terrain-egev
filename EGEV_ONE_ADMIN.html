<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#353986"><title>EGEV ONE ADMIN</title><style>
:root{--b:#353986;--bg:#f4f5f9;--line:#d9dce8;--txt:#25283a;--mut:#697080;--red:#a92e2e;--green:#27764e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:white;border-bottom:4px solid var(--b);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}header b{color:var(--b);font-size:23px}header small{color:var(--b);font-weight:700;letter-spacing:.22em}main{max-width:1100px;margin:auto;padding:14px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd0df;border-radius:8px}label{display:block;font-size:12px;color:var(--mut)}button{border:0;border-radius:8px;padding:10px 13px;background:var(--b);color:#fff;font-weight:650}.sec{background:#5e6370}.danger{background:var(--red)}.good{background:var(--green)}.mut{color:var(--mut);font-size:12px}.hidden{display:none!important}.login{max-width:420px;margin:70px auto}.err{color:#b42c2c;min-height:20px;font-size:13px}.tabs{display:flex;gap:7px}.tab{background:#e4e6ef;color:#45495a}.tab.on{background:var(--b);color:#fff}.pane{display:none}.pane.on{display:block}.item{border:1px solid var(--line);border-radius:9px;padding:10px;margin:7px 0}.badge{font-size:11px;border-radius:12px;padding:3px 8px;background:#edf0ff;color:var(--b);font-weight:700}.off{background:#ffe7e7;color:#972323}.sday{border:1px solid var(--line);border-radius:10px;margin:9px 0;background:#fff;overflow:hidden}.sday>button{width:100%;text-align:left;background:#eef0fa;color:var(--b);border-radius:0;display:flex;gap:8px;align-items:center}.sday.closed .sbody{display:none}.sbody{padding:9px}.spt{border:1px solid var(--line);border-radius:9px;padding:9px;margin:8px 0}.spt h4{margin:0 0 4px;color:var(--b)}.sph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}.sph figure{margin:0}.sph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;background:#ddd;cursor:pointer}.sph figcaption{font-size:12px;color:var(--mut)}.kpi{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.kpi span{background:#f2f3f8;border-radius:8px;padding:6px 10px;font-size:13px}#viewer{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50}#viewer img{max-width:95vw;max-height:90vh}.st-termine{background:#e2f4ea;color:#1f6b43}.st-en_cours{background:#fff0d9;color:#925c17}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:8px}}
</style></head><body><header><div><b>eGEV</b><br><small>ADMIN · EGEV ONE</small></div><div id="identity" class="mut"></div></header><main>
<section id="login" class="card login"><h2>Connexion administrateur</h2><label>E-mail<input id="email" type="email" value="crouzet.f@icloud.com" autocomplete="username"></label><br><label>Mot de passe<input id="password" type="password" autocomplete="current-password"></label><br><button id="loginBtn">Se connecter</button><div id="loginErr" class="err"></div></section>
<section id="app" class="hidden"><div class="row"><nav class="tabs"><button class="tab on" data-p="users">Utilisateurs</button><button class="tab" data-p="jobs">Chantiers</button><button class="tab" data-p="follow">Suivi terrain</button></nav><button id="refresh" class="sec" style="margin-left:auto">↻ Actualiser</button><button id="logout" class="danger">Déconnexion</button></div>
<div id="users" class="pane on"><section class="card"><h2>Inviter un utilisateur FIELD</h2><div class="grid"><label>Nom / prénom<input id="inviteName" placeholder="Ex. Bruno Paulin"></label><label>Adresse e-mail<input id="inviteEmail" type="email" placeholder="nom@exemple.fr"></label></div><br><button id="invite">✉ Envoyer l'invitation</button><span id="inviteState" class="mut"></span></section><section class="card"><div class="row"><h2 style="margin-right:auto">Utilisateurs</h2><span id="userCount" class="badge"></span></div><div id="userList"></div></section></div>
<div id="jobs" class="pane"><section class="card"><h2>Créer un chantier</h2><div class="grid"><label>Affaire<input id="jAffaire" placeholder="RAC-..."></label><label>Commune<input id="jCommune"></label><label>Adresse<input id="jAdresse"></label><label>Date terrain<input id="jDate" type="date"></label><label>Utilisateur FIELD<select id="jUser"><option value="">Non affecté</option></select></label><label>Client<input id="jClient" value="ENEDIS"></label></div><br><label>Consigne terrain<textarea id="jConsigne" placeholder="Ex. Photographier support existant + emplacement coffret"></textarea></label><br><button id="createJob">＋ Créer et affecter</button><span id="jobState" class="mut"></span></section><section class="card"><div class="row"><h2 style="margin-right:auto">Chantiers</h2><span id="jobCount" class="badge"></span></div><div id="jobList"></div></section></div>
<div id="follow" class="pane"><section class="card"><div class="row"><label style="flex:1">Chantier<select id="fJob"></select></label><button id="fLoad" class="sec">↻ Charger</button></div><div id="fHead"></div><div id="fBody" class="mut">Sélectionne un chantier.</div></section></div>
</section></main><div id="viewer"><img id="viewerImg" alt="Photo"></div>
<script>
const SUPA=window.EGEV_SUPABASE_URL||'https://xnjppjexbeyscbmptknj.supabase.co',KEY=window.EGEV_SUPABASE_KEY||'sb_publishable_0Jy-LRWHB7ZSasA0KJKraQ_GyVvB-BS';const $=id=>document.getElementById(id);let S=null,me=null,profiles=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,opt={}){const h={'apikey':KEY,'Content-Type':'application/json',...(S?{'Authorization':'Bearer '+S.access_token}:{}),...(opt.headers||{})};const r=await fetch(SUPA+path,{...opt,headers:h});let d=null;const t=await r.text();try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error((d&&d.message)||(d&&d.error)||('HTTP '+r.status));return d}
async function login(){try{$('loginErr').textContent='Connexion…';const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});S=d;sessionStorage.setItem('egevAdminSession',JSON.stringify(d));await verify()}catch(e){$('loginErr').textContent=e.message}}
async function verify(){const u=await req('/auth/v1/user');me=u;const p=await req('/rest/v1/profiles?id=eq.'+encodeURIComponent(u.id)+'&select=id,email,display_name,role,enabled');if(!p.length||p[0].role!=='admin'||!p[0].enabled)throw new Error('Ce compte n’est pas administrateur EGEV ONE.');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('identity').textContent=p[0].display_name+' · ADMIN';await loadAll()}
async function loadAll(){await loadUsers();await loadJobs();await fillFollowJobs()}
async function loadUsers(){profiles=await req('/rest/v1/profiles?select=id,email,display_name,role,enabled,created_at&order=email.asc');$('userCount').textContent=profiles.length+' utilisateur(s)';$('userList').innerHTML=profiles.map(p=>`<div class="item"><div class="row"><b>${esc(p.display_name||p.email)}</b><span class="badge">${esc(p.role.toUpperCase())}</span><span class="badge ${p.enabled?'':'off'}">${p.enabled?'ACTIF':'DÉSACTIVÉ'}</span><span class="mut">${esc(p.email)}</span>${p.email==='crouzet.f@icloud.com'?'':`<button class="${p.enabled?'danger':'good'} toggle" data-id="${p.id}" data-on="${p.enabled}">${p.enabled?'Désactiver':'Réactiver'}</button>`}</div></div>`).join('');document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>toggleUser(b.dataset.id,b.dataset.on==='true'));const sel=$('jUser');sel.innerHTML='<option value="">Non affecté</option>'+profiles.filter(p=>p.enabled&&p.role==='field').map(p=>`<option value="${p.id}">${esc(p.display_name||p.email)} — ${esc(p.email)}</option>`).join('')}
async function toggleUser(id,on){try{await req('/rest/v1/profiles?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({enabled:!on,updated_at:new Date().toISOString()})});await loadUsers()}catch(e){alert(e.message)}}
async function invite(){const email=$('inviteEmail').value.trim(),name=$('inviteName').value.trim();if(!email)return;try{$('inviteState').textContent='Envoi…';const redirect=location.origin+location.pathname.replace(/[^/]+$/,'EGEV_ONE_FIELD.html');const d=await req('/functions/v1/egev-invite-user',{method:'POST',body:JSON.stringify({email,display_name:name,redirect_to:redirect})});$('inviteState').textContent='Invitation envoyée à '+d.email;$('inviteEmail').value='';$('inviteName').value='';setTimeout(loadUsers,1200)}catch(e){$('inviteState').textContent='Erreur : '+e.message}}
async function loadJobs(){const a=await req('/rest/v1/chantiers?select=id,affaire,commune,adresse,client,consigne,planned_date,status,assigned_to,created_at&order=planned_date.desc.nullslast,created_at.desc');$('jobCount').textContent=a.length+' chantier(s)';const by=Object.fromEntries(profiles.map(p=>[p.id,p.display_name||p.email]));$('jobList').innerHTML=a.map(j=>`<div class="item"><div class="row"><b>${esc(j.affaire)}</b><span class="badge">${esc(j.status)}</span><span>${esc(j.commune||'')}</span><span class="mut">${esc(j.planned_date||'')} · ${esc(by[j.assigned_to]||'Non affecté')}</span></div><div class="mut">${esc(j.adresse||'')} ${j.consigne?'· '+esc(j.consigne):''}</div></div>`).join('')}
async function createJob(){const affaire=$('jAffaire').value.trim();if(!affaire)return alert('Affaire obligatoire.');try{$('jobState').textContent='Création…';const b={affaire,commune:$('jCommune').value.trim()||null,adresse:$('jAdresse').value.trim()||null,client:$('jClient').value.trim()||'ENEDIS',consigne:$('jConsigne').value.trim()||null,planned_date:$('jDate').value||null,assigned_to:$('jUser').value||null,created_by:me.id,status:'a_faire'};await req('/rest/v1/chantiers',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(b)});$('jobState').textContent='Chantier créé.';for(const id of ['jAffaire','jCommune','jAdresse','jConsigne'])$(id).value='';await loadJobs()}catch(e){$('jobState').textContent='Erreur : '+e.message}}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('invite').onclick=invite;$('createJob').onclick=createJob;$('refresh').onclick=loadAll;$('logout').onclick=()=>{S=null;me=null;sessionStorage.removeItem('egevAdminSession');location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===b.dataset.p))});$('jDate').valueAsDate=new Date();
(async()=>{try{const s=sessionStorage.getItem('egevAdminSession');if(s){S=JSON.parse(s);await verify()}}catch(e){sessionStorage.removeItem('egevAdminSession');$('loginErr').textContent='Session expirée : reconnecte-toi.'}})();

/* ---------- Suivi terrain ---------- */
let fJobs=[],fData=null;const blobCache={};
function frD(d){return d?new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'Sans journ\u00e9e'}
async function photoURL(path){if(blobCache[path])return blobCache[path];const r=await fetch(SUPA+'/storage/v1/object/authenticated/egev-field/'+path.split('/').map(encodeURIComponent).join('/'),{headers:{apikey:KEY,Authorization:'Bearer '+S.access_token}});if(!r.ok)throw new Error('Photo '+r.status);const b=await r.blob();blobCache[path]={url:URL.createObjectURL(b),blob:b};return blobCache[path]}
async function fillFollowJobs(){fJobs=await req('/rest/v1/chantiers?select=id,affaire,commune,adresse,status,assigned_to,planned_date,completed_at&order=created_at.desc');const cur=$('fJob').value;$('fJob').innerHTML=fJobs.map(j=>`<option value="${j.id}">${esc(j.affaire)} \u00b7 ${esc(j.commune||'')} \u00b7 ${esc(j.status)}</option>`).join('');if(cur&&fJobs.some(j=>j.id===cur))$('fJob').value=cur}
async function loadFollow(id){id=id||$('fJob').value;if(!id)return;$('fBody').textContent='Chargement\u2026';const job=fJobs.find(j=>j.id===id)||(await req('/rest/v1/chantiers?id=eq.'+id+'&select=*'))[0];
 const days=await req('/rest/v1/journees?chantier_id=eq.'+id+'&select=id,work_date,user_id,general_comment,status,started_at,ended_at&order=work_date.desc');
 const pts=await req('/rest/v1/photo_points?chantier_id=eq.'+id+'&select=id,journee_id,point_no,comment,latitude,longitude,gps_accuracy_m,captured_at,captured_by&order=captured_at.asc');
 const ids=pts.map(p=>p.id);const phs=ids.length?await req('/rest/v1/photos?point_id=in.('+ids.join(',')+')&select=id,point_id,storage_path,comment,sort_order,taken_at&order=sort_order.asc'):[];
 fData={job,days,pts,phs};renderFollow()}
function renderFollow(){const {job,days,pts,phs}=fData,who=Object.fromEntries(profiles.map(p=>[p.id,p.display_name||p.email]));
 const groups=[...days.map(d=>({day:d,pts:pts.filter(p=>p.journee_id===d.id)}))];const orphan=pts.filter(p=>!p.journee_id||!days.some(d=>d.id===p.journee_id));if(orphan.length)groups.push({day:{id:null,work_date:null,status:'',general_comment:''},pts:orphan});
 const closed=job.status==='termine'||job.status==='archive';
 $('fHead').innerHTML=`<div class="row" style="margin-top:8px"><h2 style="margin:0 auto 0 0">${esc(job.affaire)}</h2><span class="badge st-${esc(job.status)}">${esc(job.status.replace('_',' '))}</span></div><div class="mut">${esc(job.commune||'')} ${esc(job.adresse||'')} \u00b7 affect\u00e9 \u00e0 ${esc(who[job.assigned_to]||'personne')}</div><div class="kpi"><span>\ud83d\udcc5 ${days.length} journ\u00e9e(s)</span><span>\ud83d\udccd ${pts.length} point(s)</span><span>\ud83d\udcf7 ${phs.length} photo(s)</span></div><div class="row"><button id="fKmz">\ud83c\udf10 Exporter KMZ</button>${closed?'<button id="fReopen" class="sec">\u21ba Rouvrir le chantier</button>':'<button id="fClose" class="danger">\ud83c\udfc1 Cl\u00f4turer le chantier</button>'}</div>`;
 const B=$('fBody');B.innerHTML='';if(!pts.length)B.innerHTML='<div class="mut">Aucune remont\u00e9e terrain pour ce chantier.</div>';
 groups.forEach((g,gi)=>{if(!g.pts.length&&!g.day.id)return;const d=document.createElement('section');d.className='sday'+(gi?' closed':'');const np=phs.filter(p=>g.pts.some(x=>x.id===p.point_id)).length;
  d.innerHTML=`<button type="button"><b>${esc(frD(g.day.work_date))}</b><span class="badge" style="margin-left:auto">${g.pts.length} point(s) \u00b7 ${np} photo(s)</span>${g.day.status?`<span class="badge">${esc(g.day.status)}</span>`:''}</button><div class="sbody">${g.day.general_comment?`<p><b>Journ\u00e9e :</b> ${esc(g.day.general_comment)}</p>`:''}<div class="mut">${g.day.user_id?'Agent : '+esc(who[g.day.user_id]||''):''}</div></div>`;
  d.querySelector('button').onclick=()=>d.classList.toggle('closed');const body=d.querySelector('.sbody');
  g.pts.sort((a,b)=>a.point_no-b.point_no).forEach(p=>{const ph=phs.filter(x=>x.point_id===p.id);const e=document.createElement('div');e.className='spt';
   e.innerHTML=`<h4>Point ${p.point_no} <span class="badge">${ph.length} photo(s)</span></h4><div>${esc(p.comment||'')}</div><div class="mut">${p.latitude!=null?`\ud83d\udccd ${(+p.latitude).toFixed(6)}, ${(+p.longitude).toFixed(6)} \u00b7 \u00b1${Math.round(p.gps_accuracy_m||0)} m`:'Sans position GPS'}</div><div class="sph">${ph.map(x=>`<figure><img data-path="${esc(x.storage_path)}" alt="Photo"><figcaption>${esc(x.comment||'')}</figcaption></figure>`).join('')}</div>`;body.appendChild(e)});
  B.appendChild(d)});
 B.querySelectorAll('img[data-path]').forEach(async im=>{try{const o=await photoURL(im.dataset.path);im.src=o.url;im.onclick=()=>{$('viewerImg').src=o.url;$('viewer').style.display='flex'}}catch(e){im.alt='Photo indisponible'}});
 if($('fClose'))$('fClose').onclick=()=>setJobStatus('termine');if($('fReopen'))$('fReopen').onclick=()=>setJobStatus('en_cours');$('fKmz').onclick=exportKmz}
async function setJobStatus(st){if(st==='termine'&&!confirm('Cl\u00f4turer d\u00e9finitivement ce chantier ?'))return;await req('/rest/v1/chantiers?id=eq.'+fData.job.id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({status:st,completed_at:st==='termine'?new Date().toISOString():null,updated_at:new Date().toISOString()})});await fillFollowJobs();await loadFollow(fData.job.id);loadJobs()}
/* KMZ : 1 dossier par journ\u00e9e, 1 rep\u00e8re par point, toutes les photos dans la bulle */
const xml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function u16(n){return new Uint8Array([n&255,n>>>8&255])}function u32(n){return new Uint8Array([n&255,n>>>8&255,n>>>16&255,n>>>24&255])}function cat(...a){const n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n);let k=0;for(const x of a){o.set(x,k);k+=x.length}return o}
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();function crc32(a){let c=0xffffffff;for(const b of a)c=CRC[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function zipStore(files){const enc=new TextEncoder(),L=[],C=[];let off=0;for(const f of files){const n=enc.encode(f.name),d=f.data,c=crc32(d),lh=cat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),n,d);L.push(lh);C.push(cat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c),u32(d.length),u32(d.length),u16(n.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off),n));off+=lh.length}const cd=cat(...C),end=cat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cd.length),u32(off),u16(0));return new Blob([...L,cd,end],{type:'application/vnd.google-earth.kmz'})}
async function exportKmz(){const {job,days,pts,phs}=fData;const gp=pts.filter(p=>p.latitude!=null);if(!gp.length)return alert('Aucun point g\u00e9olocalis\u00e9.');$('fKmz').disabled=true;$('fKmz').textContent='Pr\u00e9paration\u2026';
 try{const files=[],folders=[];const buckets=[...days.map(d=>({d,p:gp.filter(p=>p.journee_id===d.id)})),{d:{work_date:null},p:gp.filter(p=>!days.some(d=>d.id===p.journee_id))}];
 for(const b of buckets){if(!b.p.length)continue;const marks=[];for(const p of b.p.sort((a,c)=>a.point_no-c.point_no)){const ph=phs.filter(x=>x.point_id===p.id);let html='';for(let i=0;i<ph.length;i++){const o=await photoURL(ph[i].storage_path),name=`files/${b.d.work_date||'sans-date'}_P${p.point_no}_${i+1}.jpg`;files.push({name,data:new Uint8Array(await o.blob.arrayBuffer())});html+=`<p><b>Photo ${i+1}</b>${ph[i].comment?' \u2013 '+esc(ph[i].comment):''}<br><img src="${name}" width="320"></p>`}
   marks.push(`<Placemark><name>${xml('Point '+p.point_no)}</name><description><![CDATA[<b>${esc(p.comment||'Sans commentaire')}</b><br>${ph.length} photo(s) \u00b7 \u00b1${Math.round(p.gps_accuracy_m||0)} m${html}]]></description><Point><coordinates>${p.longitude},${p.latitude},0</coordinates></Point></Placemark>`)}
  folders.push(`<Folder><name>${xml(frD(b.d.work_date))}</name>${marks.join('')}</Folder>`)}
 const kml=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xml(job.affaire)}</name>${folders.join('')}</Document></kml>`;files.unshift({name:'doc.kml',data:new TextEncoder().encode(kml)});
 const a=document.createElement('a');a.href=URL.createObjectURL(zipStore(files));a.download='EGEV_ONE_'+String(job.affaire).replace(/[^a-z0-9_-]+/gi,'_')+'.kmz';document.body.appendChild(a);a.click();a.remove()}catch(e){alert('Export KMZ impossible : '+e.message)}finally{$('fKmz').disabled=false;$('fKmz').textContent='\ud83c\udf10 Exporter KMZ'}}
$('fLoad').onclick=()=>loadFollow();$('fJob').onchange=()=>loadFollow();$('viewer').onclick=()=>{$('viewer').style.display='none'};
</script></body></html>
