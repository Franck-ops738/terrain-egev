<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#353986"><title>EGEV ONE FIELD</title><link rel="manifest" href="manifest-field.webmanifest"><style>
:root{--b:#353986;--o:#ff8a2a;--g:#258053;--bg:#f4f5f9;--line:#d9dce8;--txt:#25283a;--mut:#6b7180}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:4px solid var(--o);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.brand b{font-size:25px;color:var(--b)}.brand span{display:block;color:var(--o);font-weight:800;letter-spacing:.28em;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--b);color:#fff;font:600 15px system-ui}.sec{background:#626776}.good{background:var(--g)}.danger{background:#a92e2e}.hidden{display:none!important}.badge{font-size:11px;font-weight:700;border-radius:15px;padding:4px 8px;background:#edf0ff;color:var(--b)}.badge.off{background:#fff0d9;color:#925c17}.badge.err{background:#ffe5e5;color:#a62b2b}main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0}.login{max-width:420px;margin:55px auto}.login input,input,textarea{width:100%;padding:11px;border:1px solid #cbd0df;border-radius:9px;font:16px system-ui;margin:5px 0 10px}label{font-size:12px;color:var(--mut)}.err{color:#b42c2c;font-size:13px;min-height:18px}.mut{color:var(--mut);font-size:12px}.job{border:1px solid var(--line);border-left:5px solid var(--o);border-radius:11px;padding:12px;margin:9px 0}.job h3{margin:0;color:var(--b)}.job p{margin:4px 0}.status-a_faire{border-left-color:#7f87aa}.status-en_cours{border-left-color:var(--o)}.status-termine{border-left-color:var(--g)}.consigne{background:#fff5e9;border:1px solid #f2c994;border-radius:9px;padding:10px;margin:8px 0}.point{border:1px solid var(--line);border-radius:11px;padding:10px;margin:10px 0;background:#fff}.point h3{margin:0 0 5px;color:var(--b)}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;background:#111}.gps{font-size:12px;color:#3f664e}.sync{font-size:12px;color:var(--mut)}#photoBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;background:#fff;border:1px solid var(--line);border-radius:40px;padding:8px;box-shadow:0 7px 25px #0003;display:flex;gap:8px}.photoBtn{background:var(--o);font-size:20px;padding:15px 28px;border-radius:32px}#workspace{padding-bottom:105px}.empty{text-align:center;padding:25px;color:var(--mut)}@media(max-width:600px){header .mail{display:none}main{padding:8px}#photoBar{left:8px;right:8px;transform:none}#photoBar .photoBtn{flex:1}}
</style></head><body><header><div class="brand"><b>eGEV ONE</b><span>FIELD</span></div><div class="row"><span id="cloud" class="badge off">hors ligne</span><span id="who" class="mut mail"></span><button id="logout" class="sec hidden" type="button">Déconnexion</button></div></header><main>
<section id="login" class="card login"><h2>Connexion FIELD</h2><label>Adresse e-mail<input id="email" type="email" autocomplete="username"></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" type="button">Se connecter</button><div id="loginErr" class="err"></div><p class="mut">La première connexion nécessite internet. Ensuite les chantiers déjà téléchargés restent disponibles hors ligne.</p></section>
<section id="home" class="hidden"><div class="row"><h2 style="margin-right:auto">Mes chantiers</h2><button id="refresh" class="sec" type="button">↻ Synchroniser</button></div><div id="jobs"></div><div id="noJobs" class="empty hidden">Aucun chantier ne t'est affecté.</div></section>
<section id="workspace" class="hidden"><button id="back" class="sec" type="button">← Mes chantiers</button><section class="card"><div class="row"><h2 id="title" style="margin:0 auto 0 0"></h2><span id="jobStatus" class="badge"></span></div><p id="place"></p><div id="instruction" class="consigne hidden"></div></section><div id="points"></div><button id="finish" class="good" type="button">✅ TERMINER LE CHANTIER</button></section>
</main><div id="photoBar" class="hidden"><label class="btn photoBtn">📷 PRENDRE UNE PHOTO<input id="camera" type="file" accept="image/*" capture="environment" hidden></label></div>
<script>
const SUPA=window.EGEV_SUPABASE_URL||'https://xnjppjexbeyscbmptknj.supabase.co',KEY=window.EGEV_SUPABASE_KEY||'sb_publishable_0Jy-LRWHB7ZSasA0KJKraQ_GyVvB-BS',SESSION='egevOneFieldSession';const $=i=>document.getElementById(i);let db,session=null,user=null,profile=null,jobs=[],current=null,syncing=false,syncTimer=null;
const uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),now=()=>new Date().toISOString();
function idb(){return new Promise((r,j)=>{const q=indexedDB.open('EGEV_ONE_FIELD',1);q.onupgradeneeded=()=>q.result.createObjectStore('data');q.onsuccess=()=>{db=q.result;r()};q.onerror=j})}function put(k,v){return new Promise((r,j)=>{const q=db.transaction('data','readwrite').objectStore('data').put(v,k);q.onsuccess=r;q.onerror=j})}function get(k){return new Promise((r,j)=>{const q=db.transaction('data').objectStore('data').get(k);q.onsuccess=()=>r(q.result);q.onerror=j})}
async function api(path,opt={}){const h={'apikey':KEY,...(session?{'Authorization':'Bearer '+session.access_token}:{}),...(opt.headers||{})};if(opt.json!==false)h['Content-Type']='application/json';const r=await fetch(SUPA+path,{...opt,headers:h});const t=await r.text();let d=t;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw new Error((d&&d.message)||(d&&d.error)||('HTTP '+r.status));return d}
function cloud(txt,cls=''){ $('cloud').textContent=txt;$('cloud').className='badge '+cls }
async function auth(){try{$('loginErr').textContent='Connexion…';session=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});localStorage.setItem(SESSION,JSON.stringify(session));await boot()}catch(e){$('loginErr').textContent=e.message}}
async function boot(){try{user=await api('/auth/v1/user');const p=await api('/rest/v1/profiles?id=eq.'+user.id+'&select=id,email,display_name,role,enabled');if(!p.length||!p[0].enabled)throw new Error('Compte FIELD désactivé.');profile=p[0];await put('profile',profile);$('who').textContent=profile.display_name||profile.email;$('login').classList.add('hidden');$('logout').classList.remove('hidden');$('home').classList.remove('hidden');await pull()}catch(e){if(!navigator.onLine){profile=await get('profile');if(profile){$('who').textContent=profile.display_name||profile.email;$('login').classList.add('hidden');$('logout').classList.remove('hidden');$('home').classList.remove('hidden');cloud('hors ligne','off');renderJobs();return}}throw e}}
async function refreshToken(){if(!session?.refresh_token)return;session=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:session.refresh_token})});localStorage.setItem(SESSION,JSON.stringify(session))}
function normalizeRemote(r){let j=jobs.find(x=>x.id===r.id);if(!j)j={id:r.id,groups:[],dirty:false};j.meta={affaire:r.affaire,commune:r.commune||'',adresse:r.adresse||'',client:r.client||'',consigne:r.consigne||'',date:r.planned_date||''};j.status=r.status;j.cloud=true;j.updated=r.updated_at||now();return j}
async function pull(){if(!navigator.onLine)return renderJobs();try{cloud('synchronisation…','off');await refreshToken().catch(()=>{});const rows=await api('/rest/v1/chantiers?select=id,affaire,commune,adresse,client,consigne,planned_date,status,updated_at&order=planned_date.asc.nullslast,created_at.desc');const remoteIds=new Set(rows.map(r=>r.id));const local=jobs.filter(j=>j.dirty||!j.cloud||remoteIds.has(j.id));for(const r of rows){const n=normalizeRemote(r),i=local.findIndex(x=>x.id===n.id);if(i<0)local.push(n)}jobs=local;await put('jobs',jobs);cloud('à jour','');renderJobs();scheduleSync(100)}catch(e){cloud('erreur sync','err');console.error(e)} }
function renderJobs(){const root=$('jobs');root.innerHTML='';const list=[...jobs].sort((a,b)=>(a.meta.date||'9999').localeCompare(b.meta.date||'9999'));$('noJobs').classList.toggle('hidden',!!list.length);for(const j of list){const d=document.createElement('div');d.className='job status-'+j.status;d.innerHTML=`<div class="row"><h3 style="margin-right:auto">${esc(j.meta.affaire)}</h3><span class="badge">${esc(j.status.replace('_',' '))}</span></div><p>📍 ${esc(j.meta.commune)} ${esc(j.meta.adresse)}</p><p class="mut">📅 ${esc(j.meta.date||'Date non fixée')} · 📷 ${(j.groups||[]).reduce((s,g)=>s+g.photos.length,0)} photo(s)</p><button type="button">OUVRIR</button>`;d.querySelector('button').onclick=()=>openJob(j.id);root.appendChild(d)}}
function openJob(id){current=jobs.find(x=>x.id===id);if(!current)return;current.groups=current.groups||[];if(current.status==='a_faire'){current.status='en_cours';current.dirty=true;saveLocal()}$('home').classList.add('hidden');$('workspace').classList.remove('hidden');$('photoBar').classList.remove('hidden');$('title').textContent=current.meta.affaire;$('place').textContent=[current.meta.commune,current.meta.adresse].filter(Boolean).join(' — ');$('instruction').textContent=current.meta.consigne||'';$('instruction').classList.toggle('hidden',!current.meta.consigne);renderPoints()}
function renderPoints(){if(!current)return;$('jobStatus').textContent=current.status.replace('_',' ');const root=$('points');root.innerHTML='';if(!current.groups.length)root.innerHTML='<div class="empty">Appuie sur 📷 PRENDRE UNE PHOTO</div>';current.groups.forEach((g,i)=>{const d=document.createElement('section');d.className='point';d.innerHTML=`<div class="row"><h3 style="margin-right:auto">Point ${i+1}</h3><span class="badge">${g.photos.length} photo(s)</span></div><div class="gps">${g.geo?'📍 '+g.geo.lat.toFixed(6)+', '+g.geo.lon.toFixed(6)+' · ±'+Math.round(g.geo.accuracy)+' m':'GPS en attente'}</div><textarea placeholder="Commentaire commun"></textarea><div class="photos">${g.photos.map(p=>`<img src="${p.data}" alt="Photo">`).join('')}</div><div class="sync">${g.synced?'☁ Synchronisé':'⏳ À synchroniser'}</div>`;d.querySelector('textarea').value=g.comment||'';d.querySelector('textarea').onchange=e=>{g.comment=e.target.value;g.synced=false;saveLocal()};root.appendChild(d)})}
function gps(){return new Promise(r=>{if(!navigator.geolocation)return r(null);let done=false,best=null,w=null;const end=()=>{if(done)return;done=true;if(w!==null)navigator.geolocation.clearWatch(w);r(best)};try{w=navigator.geolocation.watchPosition(p=>{const g={lat:p.coords.latitude,lon:p.coords.longitude,alt:p.coords.altitude,accuracy:p.coords.accuracy,time:new Date(p.timestamp).toISOString()};if(!best||g.accuracy<best.accuracy)best=g;if(g.accuracy<=30)end()},()=>end(),{enableHighAccuracy:true,maximumAge:0,timeout:12000});setTimeout(end,12000)}catch(e){r(null)}})}
async function img(file){const u=URL.createObjectURL(file);try{const im=await new Promise((r,j)=>{const x=new Image;x.onload=()=>r(x);x.onerror=j;x.src=u}),m=1800,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.84)}finally{URL.revokeObjectURL(u)}}
function distance(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180;const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
async function take(files){const file=files[0];if(!file||!current)return;const gp=gps(),data=await img(file),p={id:uid(),data,name:file.name||'photo.jpg',time:now(),remoteId:null,path:null};let geo=await gp,last=current.groups[current.groups.length-1],target=last;if(!last)target=null;else if(geo&&last.geo){const d=distance(last.geo,geo);if(d>60)target=null;else if(d>=30&&!confirm(`La photo est à environ ${Math.round(d)} m du dernier point.\nOK = même point · Annuler = nouveau point`))target=null}if(!target){target={id:uid(),remoteId:null,pointNo:current.groups.length+1,geo,comment:'',photos:[],synced:false};current.groups.push(target)}else if(!target.geo&&geo)target.geo=geo;target.photos.push(p);target.synced=false;current.dirty=true;await saveLocal();renderPoints();scheduleSync(100)}
async function saveLocal(){await put('jobs',jobs);renderJobs();if(current)renderPoints();scheduleSync()}
function scheduleSync(ms=700){clearTimeout(syncTimer);syncTimer=setTimeout(syncAll,ms)}
function dataBlob(d){const b=atob(d.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/jpeg'})}
async function syncAll(){if(syncing||!navigator.onLine||!session)return;syncing=true;try{cloud('envoi…','off');for(const j of jobs)await syncJob(j);await put('jobs',jobs);cloud('à jour','');if(current)renderPoints();renderJobs()}catch(e){cloud('sync en attente','off');console.error(e)}finally{syncing=false}}
async function syncJob(j){if(!j.cloud)return;if(j.dirty){await api('/rest/v1/chantiers?id=eq.'+j.id,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({status:j.status,completed_at:j.status==='termine'?now():null,updated_at:now()})});j.dirty=false}for(let i=0;i<j.groups.length;i++){const g=j.groups[i],body={chantier_id:j.id,point_no:i+1,category:'Photo chantier',comment:g.comment||null,latitude:g.geo?.lat||null,longitude:g.geo?.lon||null,altitude:g.geo?.alt||null,gps_accuracy_m:g.geo?.accuracy||null,captured_by:user.id,captured_at:g.geo?.time||now(),updated_at:now()};if(!g.remoteId){const x=await api('/rest/v1/photo_points',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});g.remoteId=x[0].id}else await api('/rest/v1/photo_points?id=eq.'+g.remoteId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(body)});for(let k=0;k<g.photos.length;k++){const p=g.photos[k];if(p.remoteId)continue;const path=`${j.id}/${g.remoteId}/${p.id}.jpg`;await api('/storage/v1/object/egev-field/'+path,{method:'POST',json:false,headers:{'Content-Type':'image/jpeg','x-upsert':'true'},body:dataBlob(p.data)});const x=await api('/rest/v1/photos',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({point_id:g.remoteId,storage_path:path,original_name:p.name,annotated:false,sort_order:k,taken_at:p.time,uploaded_by:user.id})});p.remoteId=x[0].id;p.path=path}g.synced=g.photos.every(p=>p.remoteId)} }
$('camera').onchange=e=>{const f=Array.from(e.target.files||[]);e.target.value='';take(f)};$('back').onclick=()=>{$('workspace').classList.add('hidden');$('photoBar').classList.add('hidden');$('home').classList.remove('hidden');current=null;pull()};$('finish').onclick=async()=>{if(!current.groups.length)return alert('Aucune photo.');if(!confirm('Terminer ce chantier ?'))return;current.status='termine';current.dirty=true;await saveLocal();await syncAll();$('back').click()};$('refresh').onclick=pull;$('loginBtn').onclick=auth;$('password').onkeydown=e=>{if(e.key==='Enter')auth()};$('logout').onclick=()=>{localStorage.removeItem(SESSION);location.reload()};addEventListener('online',()=>{cloud('connexion…','off');pull()});addEventListener('offline',()=>cloud('hors ligne','off'));
(async()=>{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker-field.js').catch(()=>{});await idb();jobs=(await get('jobs'))||[];const s=localStorage.getItem(SESSION);if(s){try{session=JSON.parse(s);await boot()}catch(e){if(!navigator.onLine){profile=await get('profile');if(profile){$('login').classList.add('hidden');$('home').classList.remove('hidden');$('logout').classList.remove('hidden');renderJobs();cloud('hors ligne','off')}}else{localStorage.removeItem(SESSION);$('loginErr').textContent='Session expirée : reconnecte-toi.'}}}})();
</script></body></html>
